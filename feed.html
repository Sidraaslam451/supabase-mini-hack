<div class="signup-box" style="width: 100%; max-width: 600px;">
    <h2>Create New Post</h2>
    <div class="input-group">
        <label>Post Title</label>
        <input type="text" id="post-title" placeholder="What's the title?">
    </div>
    <div class="input-group">
        <label>Description</label>
        <textarea id="post-desc" style="width:100%; background:rgba(255,255,255,0.08); border:none; color:white; padding:10px; border-radius:10px;" rows="4"></textarea>
    </div>
    <div class="input-group">
        <label>Upload Image</label>
        <input type="file" id="post-image" accept="image/*">
    </div>
    <button id="create-post-btn">Publish Post</button>
</div>
