    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PostApp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="login-container">
        <div class="signup-box"> <h2>Welcome Back</h2>
            <p class="subtitle">Enter your details to access your feed</p>

            <form id="login">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="login-btn">Log In</button>
            </form>

            <p class="footer-text">Don't have an account? <a href="index.html">Sign up</a></p>
        </div>
    </div>

        <script type="module" src="signin.js"></script>

</body>
</html>
